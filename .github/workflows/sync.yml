name: Upstream Sync and Validate

on:
  # 允许手动触发
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: '上游分支名称'
        required: true
        default: 'main'
  # 定时自动同步（例如：每天北京时间 0点 执行一次）
  schedule:
    - cron: '0 16 * * *'

jobs:
  sync_and_verify:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # 赋予提交代码到仓库的权限

    steps:
      - name: 1. 检出当前仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. 配置 Git 身份
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: 3. 同步上游/拉取更新
        id: sync_upstream
        run: |
          # 示例：若您是从指定上游仓库同步（如需替换为您的实际目标，请修改 URL）
          # 留空或按需配置上游远程仓库
          UPSTREAM_URL="https://github.com/yonggekkk/sing-box-yg.git"
          
          echo "正在连接上游仓库: $UPSTREAM_URL"
          git remote add upstream "$UPSTREAM_URL" || git remote set-url upstream "$UPSTREAM_URL"
          git fetch upstream
          
          # 尝试合并上游更新（此处以合并指定文件或分支为例，采用ort策略避免冲突）
          # 如果您只想同步特定脚本文件，可以使用 git checkout upstream/main -- script.sh
          if git merge upstream/main --allow-unrelated-histories --no-commit; then
            echo "sync_status=success" >> $GITHUB_OUTPUT
            echo "上游代码拉取与合并成功。"
          else
            echo "sync_status=conflict" >> $GITHUB_OUTPUT
            echo "合并遇到冲突，自动回滚本次合并，请人工介入。"
            git merge --abort
            exit 1
          fi

      - name: 4. 脚本语法有效性校验
        id: validate_scripts
        run: |
          echo "开始对同步后的脚本进行静态语法检查..."
          INVALID_COUNT=0
          
          # 遍历目录下的所有 .sh 脚本进行基础语法检查 (bash -n)
          for script in $(find . -name "*.sh" -not -path "./.git/*"); do
            if bash -n "$script"; then
              echo "✅ 语法正常: $script"
            else
              echo "❌ 语法错误: $script"
              INVALID_COUNT=$((INVALID_COUNT + 1))
            fi
          done
          
          if [ $INVALID_COUNT -gt 0 ]; then
            echo "检测到 $INVALID_COUNT 个脚本存在语法错误，终止提交！"
            exit 1
          else
            echo "所有脚本校验通过。"
          fi

      - name: 5. 检测文件变动情况
        id: check_changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "没有检测到文件内容变更，跳过提交步骤。"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "检测到文件有更新。"
          fi

      - name: 6. 提交并推送更新
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git add .
          git commit -m "chore(sync): 自动同步上游更新并完成校验 [skip ci]"
          git push origin HEAD:main

      - name: 7. 生成执行报告摘要
        if: always()
        run: |
          echo "### 🔄 同步与校验报告" >> $GITHUB_STEP_SUMMARY
          echo "- **执行时间**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **同步状态**: `${{ steps.sync_upstream.outputs.sync_status }}`" >> $GITHUB_STEP_SUMMARY
          echo "- **变动情况**: `${{ steps.check_changes.outputs.has_changes }}`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check_changes.outputs.has_changes }}" == "true" ]; then
            echo "- **操作结果**: 成功同步上游更改并推送至仓库主分支。" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **操作结果**: 代码已是最新，无须更新。" >> $GITHUB_STEP_SUMMARY
          fi
