name: TVBox Helper Auto Run

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0,12 * * *'

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests curl_cffi

      - name: Run TVBox Helper with Deep Byte-Decoding & PHP/Kstore Ultimate Bypass
        env:
          TG_TOKEN_1: ${{ secrets.TG_TOKEN_1 }}
          TG_CHAT_1: ${{ secrets.TG_CHAT_1 }}
          TG_TOKEN_2: ${{ secrets.TG_TOKEN_2 }}
          TG_CHAT_2: ${{ secrets.TG_CHAT_2 }}
          TG_TOKEN_3: ${{ secrets.TG_TOKEN_3 }}
          TG_CHAT_3: ${{ secrets.TG_CHAT_3 }}
          TG_TOKEN_4: ${{ secrets.TG_TOKEN_4 }}
          TG_CHAT_4: ${{ secrets.TG_CHAT_4 }}
          TG_TOKEN_5: ${{ secrets.TG_TOKEN_5 }}
          TG_CHAT_5: ${{ secrets.TG_CHAT_5 }}
          TG_TOKEN_6: ${{ secrets.TG_TOKEN_6 }}
          TG_CHAT_6: ${{ secrets.TG_CHAT_6 }}
          TG_TOKEN_7: ${{ secrets.TG_TOKEN_7 }}
          TG_CHAT_7: ${{ secrets.TG_CHAT_7 }}
          TG_TOKEN_8: ${{ secrets.TG_TOKEN_8 }}
          TG_CHAT_8: ${{ secrets.TG_CHAT_8 }}
          TG_TOKEN_9: ${{ secrets.TG_TOKEN_9 }}
          TG_CHAT_9: ${{ secrets.TG_CHAT_9 }}
          TG_TOKEN_10: ${{ secrets.TG_TOKEN_10 }}
          TG_CHAT_10: ${{ secrets.TG_CHAT_10 }}
        run: |
          cat << 'EOF' > run_helper.py
          import os, re, requests, time, sys, json, hashlib, shutil, base64, zlib, gzip, random
          from datetime import datetime, timezone, timedelta
          from urllib.parse import urljoin, urlparse
          import urllib3

          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

          bj_time = datetime.now(timezone(timedelta(hours=8))).strftime('%Y-%m-%d %H:%M:%S')
          state_file = '.source_state.json'

          USER_AGENTS = [
              'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
              'Mozilla/5.0 (Linux; Android 13; V2231A Build/TP1A.220624.014) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.6099.43 Mobile Safari/537.36',
              'TVBox/1.1.4 (Linux; Android 11)',
              'okhttp/4.10.0'
          ]

          try:
              from curl_cffi import requests as cffi_requests
              HAS_CFFI = True
          except ImportError:
              HAS_CFFI = False

          # 1. 深度字节解密与 JSON 清洗引擎（完美支持 HTTP 456 状态码穿透与混淆解密）
          def parse_tvbox_content(raw_bytes, target_url=''):
              content_candidates = []

              if b'IEND' in raw_bytes:
                  try:
                      iend_pos = raw_bytes.rfind(b'IEND')
                      after_iend = raw_bytes[iend_pos + 8:]
                      content_candidates.append(after_iend.decode('utf-8', errors='ignore'))
                  except Exception:
                      pass

              try:
                  text_preview = raw_bytes[:120].decode('utf-8', errors='ignore').strip()
                  if text_preview.startswith('2423') or (len(text_preview) > 50 and all(c in '0123456789abcdefABCDEF' for c in text_preview[:100])):
                      raw_bytes = bytes.fromhex(text_preview)
              except Exception:
                  pass

              try:
                  if raw_bytes.startswith(b'$#'):
                      idx_end = raw_bytes.find(b'#$', 2)
                      if idx_end != -1:
                          raw_bytes = raw_bytes[idx_end + 2:]
              except Exception:
                  pass

              try:
                  content_candidates.append(raw_bytes.decode('utf-8', errors='ignore'))
              except:
                  pass
                  
              try:
                  content_candidates.append(zlib.decompress(raw_bytes).decode('utf-8', errors='ignore'))
              except:
                  try:
                      content_candidates.append(gzip.decompress(raw_bytes).decode('utf-8', errors='ignore'))
                  except:
                      pass

              try:
                  full_str = raw_bytes.decode('latin1', errors='ignore')
                  b64_matches = re.findall(r'[A-Za-z0-9+/=]{30,}', full_str)
                  for b64_str in b64_matches:
                      try:
                          dec = base64.b64decode(b64_str.encode('utf-8'))
                          content_candidates.append(dec.decode('utf-8', errors='ignore'))
                          try:
                              content_candidates.append(zlib.decompress(dec).decode('utf-8', errors='ignore'))
                          except:
                              pass
                      except:
                          pass
              except:
                  pass

              content_candidates.append(raw_bytes.decode('latin1', errors='ignore'))
              combined_content = "\n".join(content_candidates)
              
              clean_lines = []
              for line in combined_content.splitlines():
                  line_no_comment = re.sub(r'(?<![:])//.*', '', line)
                  clean_lines.append(line_no_comment)
              clean_content = '\n'.join(clean_lines)
              clean_content = re.sub(r',\s*([\]}])', r'\1', clean_content).strip()

              possible_indices = [i for i, char in enumerate(clean_content) if char in ('{', '[')]
              json_data = None
              
              for idx in possible_indices:
                  try:
                      data, _ = json.JSONDecoder().raw_decode(clean_content, idx)
                      if isinstance(data, (dict, list)) and len(data) > 0:
                          if isinstance(data, dict) and any(k in data for k in ('sites', 'spider', 'lives', 'channels', 'parses')):
                              json_data = data
                              break
                          elif json_data is None and isinstance(data, dict):
                              json_data = data
                  except Exception:
                      continue

              if json_data is None and 'sites' in clean_content:
                  match = re.search(r'(\{[\s\S]*\}|\[[\s\S]*\])', clean_content)
                  if match:
                      try:
                          json_data = json.loads(match.group(1))
                      except Exception:
                          pass

              if json_data is None:
                  raise ValueError("未能提取到合法的 JSON 配置对象")
                  
              return json_data, clean_content

          # 2. 独立文件下载辅助函数（支持 456 状态码放行与指纹穿透）
          def download_file(url, save_path, base_url=None):
              if not url or not isinstance(url, str): return False
              if "127.0.0.1" in url or "localhost" in url: return False
              if base_url and not url.startswith("http://") and not url.startswith("https://"):
                  url = urljoin(base_url, url)
              if not (url.startswith("http://") or url.startswith("https://")): return False

              clean_url = url.split('?')[0] if '?' in url else url
              urls_to_try = [clean_url, url]
              
              for current_url in urls_to_try:
                  try:
                      os.makedirs(os.path.dirname(save_path), exist_ok=True)
                      parsed_url = urlparse(current_url)
                      base_root = f"{parsed_url.scheme}://{parsed_url.netloc}"
                      
                      for ua in USER_AGENTS:
                          try:
                              res = requests.get(current_url, headers={"User-Agent": ua, "Referer": base_root + "/"}, verify=False, timeout=30)
                              # 关键：只要有内容且包含数据，不论状态码是否为 200（如 456）均接受
                              if res.content and len(res.content) > 50:
                                  with open(save_path, 'wb') as sf:
                                      sf.write(res.content)
                                  return True
                          except Exception:
                              continue
                              
                      if HAS_CFFI:
                          try:
                              res = cffi_requests.get(current_url, impersonate="chrome120", timeout=30)
                              if res.content and len(res.content) > 50:
                                  with open(save_path, 'wb') as sf:
                                      sf.write(res.content)
                                  return True
                          except Exception:
                              pass
                  except Exception:
                      pass
              return False

          # 3. 资源本地化与 PHP 伪装后缀（?.jar）处理引擎
          def process_spider_and_jars(json_data, target_dir, active_target_url=None):
              if not isinstance(json_data, dict): return json_data
              lib_dir = os.path.join(target_dir, "lib")
              os.makedirs(lib_dir, exist_ok=True)

              # 处理全局 spider
              spider = json_data.get("spider", "")
              if spider and isinstance(spider, str):
                  parts = spider.split(';')
                  url_or_path = parts[0].strip()
                  if url_or_path.startswith("http://") or url_or_path.startswith("https://"):
                      jar_basename = os.path.basename(urlparse(url_or_path).path) or "spider.jar"
                      download_file(url_or_path, os.path.join(lib_dir, jar_basename), base_url=active_target_url)
                      if url_or_path.lower().endswith('.php') and '?.jar' not in url_or_path:
                          parts[0] = url_or_path + "?.jar"
                          json_data["spider"] = ';'.join(parts)

              # 处理 sites 子源 jar（自动追加 ?.jar 伪装后缀）
              sites = json_data.get("sites", [])
              for site in sites:
                  if not isinstance(site, dict): continue
                  site_jar = site.get("jar")
                  if isinstance(site_jar, str) and site_jar.strip():
                      if site_jar.startswith("http://") or site_jar.startswith("https://"):
                          jar_basename = os.path.basename(urlparse(site_jar).path) or "jar.jar"
                          download_file(site_jar, os.path.join(lib_dir, jar_basename), base_url=active_target_url)
                          if site_jar.lower().endswith('.php') and '?.jar' not in site_jar:
                              site["jar"] = site_jar + "?.jar"

                  ext = site.get("ext")
                  if isinstance(ext, str) and ext.strip():
                      if (ext.startswith("http://") or ext.startswith("https://")) and not any(k in ext for k in ['22776', 'api', 'server']):
                          filename = os.path.basename(ext.split('?')[0]) or "ext.json"
                          save_path = os.path.join(lib_dir, filename)
                          if download_file(ext, save_path, base_url=active_target_url):
                              site["ext"] = f"./lib/{filename}"

              # 处理 lives 直播源
              lives = json_data.get("lives", [])
              for live in lives:
                  if not isinstance(live, dict): continue
                  url = live.get("url", "")
                  if isinstance(url, str) and url.strip() and (url.startswith("http://") or url.startswith("https://")):
                      filename = os.path.basename(url.split('?')[0]) or "live.m3u"
                      save_path = os.path.join(target_dir, "live", filename)
                      if download_file(url, save_path, base_url=active_target_url):
                          live["url"] = f"./live/{filename}"

              return json_data

          # 自动初始化 sources_list.txt
          default_sources_content = (
              "茄子库,http://boluo.live | http://vip.boluo.live | http://李白.shop | https://700sjro44343.vicp.fun/vip/2505/qiezi/tv.php | https://700sjro44343.vicp.fun/vip/2505/qiezi/duo.txt\n"
              "无意云,https://yc.wya6.cn/wykj.php | https://yc.wya6.cn/wyxs.php\n"
          )

          if not os.path.exists('sources_list.txt'):
              with open('sources_list.txt', 'w', encoding='utf-8') as f:
                  f.write(default_sources_content)
          else:
              with open('sources_list.txt', 'r', encoding='utf-8') as f:
                  existing_content = f.read()
              if "茄子库" not in existing_content and "无意云" not in existing_content:
                  with open('sources_list.txt', 'a', encoding='utf-8') as f:
                      f.write("\n" + default_sources_content)

          old_state = {}
          if os.path.exists(state_file):
              try:
                  with open(state_file, 'r', encoding='utf-8') as f:
                      old_state = json.load(f)
              except:
                  pass

          new_state = {}
          sources_raw = []
          if os.path.exists('sources_list.txt'):
              with open('sources_list.txt', 'r', encoding='utf-8') as f:
                  sources_raw = [line.strip() for line in f if line.strip()]

          new_sources_lines = []
          source_results = []

          for idx, line in enumerate(sources_raw, 1):
              if line.startswith('#'):
                  new_sources_lines.append(line)
                  continue
              
              parts = line.split(',', 1)
              name = parts[0].strip() if len(parts) > 1 else f'源{idx}'
              url_part = parts[1] if len(parts) > 1 else line
              urls = [u.strip() for u in re.split(r'[|\s]+', url_part) if u.strip().startswith('http')]
              
              if not urls:
                  source_results.append(f'📌 <b>源 [{idx}] ({name})</b>\n状态: ❌ 失败 (未找到有效网址)')
                  new_sources_lines.append(line)
                  continue
                  
              working_url = None
              fail_details = []
              fetched_content = None
              parsed_json = None
              
              for u_idx, url in enumerate(urls, 1):
                  addr_type = '主地址' if u_idx == 1 else f'备用地址 {u_idx-1}'
                  success = False
                  last_err = ''
                  
                  parsed_u = urlparse(url)
                  domain_referer = f"{parsed_u.scheme}://{parsed_u.netloc}/"
                  
                  for ua in USER_AGENTS:
                      try:
                          res = requests.get(url, headers={'User-Agent': ua, 'Referer': domain_referer}, timeout=30, verify=False)
                          # 核心：允许 456 等返回状态码，只要有字节内容就尝试深度解码
                          if res.content and len(res.content) > 50:
                              try:
                                  parsed_json, _ = parse_tvbox_content(res.content, url)
                                  fetched_content = res.content
                                  success = True
                                  break
                              except Exception as inner_ex:
                                  last_err = f'解析失败: {inner_ex}'
                          else:
                              last_err = f'HTTP状态码 {res.status_code}'
                      except Exception as e:
                          last_err = f'异常 {str(e)}'
                  
                  if not success and HAS_CFFI:
                      try:
                          res = cffi_requests.get(url, impersonate="chrome120", timeout=30)
                          if res.content and len(res.content) > 50:
                              parsed_json, _ = parse_tvbox_content(res.content, url)
                              fetched_content = res.content
                              success = True
                      except Exception as e:
                          last_err = f'CFFI异常 {str(e)}'

                  if success:
                      working_url = url
                      break
                  else:
                      fail_details.append(f'{addr_type} ({url}): {last_err}')
                      
              if not working_url:
                  details_str = '\n  '.join(fail_details)
                  source_results.append(f'📌 <b>源 [{idx}] ({name})</b>\n状态: ❌ <b>全部地址失效</b>\n  {details_str}')
                  new_sources_lines.append(line)
              else:
                  jar_status_tip = ''
                  try:
                      target_dir = os.path.join("./sources_files", name)
                      os.makedirs(target_dir, exist_ok=True)
                      
                      api_path = os.path.join(target_dir, "api.json")
                      output_path = os.path.join(target_dir, "api_改.json")
                      local_json_path = os.path.join(target_dir, "api_本地版.json")

                      with open(api_path, 'wb') as f:
                          f.write(fetched_content)

                      with open(output_path, 'w', encoding='utf-8') as f:
                          json.dump(parsed_json, f, ensure_ascii=False, indent=2)

                      local_json_data = json.loads(json.dumps(parsed_json))
                      local_json_data = process_spider_and_jars(local_json_data, target_dir, working_url)

                      with open(local_json_path, 'w', encoding='utf-8') as f:
                          json.dump(local_json_data, f, ensure_ascii=False, indent=2)

                      jar_status_tip = ' | 📦 <b>全套本地化与PHP伪装完成</b>'
                      normalized_str = json.dumps(parsed_json, sort_keys=True, ensure_ascii=False)
                  except Exception as je:
                      jar_status_tip = f' | ❌ <b>本地化异常: {je}</b>'
                      normalized_str = re.sub(r'\s+', '', fetched_content.decode('utf-8', errors='ignore'))

                  content_hash = hashlib.md5(normalized_str.encode('utf-8')).hexdigest()
                  prev_info = old_state.get(name, {})
                  prev_hash = prev_info.get('hash', '')
                  prev_time = prev_info.get('time', bj_time)
                  
                  update_status = '✨ 内容已更新' if content_hash != prev_hash else '🟢 内容无变化'
                  last_update_time = bj_time if content_hash != prev_hash else prev_time
                      
                  new_state[name] = {'hash': content_hash, 'time': last_update_time}
                  source_results.append(f'📌 <b>源 [{idx}] ({name})</b>\n状态: ✅ 成功 | {update_status}{jar_status_tip}\n地址: {working_url}\n最后更新时间: {last_update_time}')
                  
                  other_urls = [u for u in urls if u != working_url]
                  reordered_line = f'{name},' + ' | '.join([working_url] + other_urls) if len(parts) > 1 else working_url
                  new_sources_lines.append(reordered_line)

          with open(state_file, 'w', encoding='utf-8') as f:
              json.dump(new_state, f, ensure_ascii=False, indent=2)

          with open('sources_list.txt', 'w', encoding='utf-8') as f:
              f.write('\n'.join(new_sources_lines) + '\n')

          details_text = '\n\n'.join(source_results)
          message = f'<b>📊 TVBox 智能备用源独立监控报告</b>\n\n{details_text}'

          for i in range(1, 11):
              token = os.getenv(f'TG_TOKEN_{i}')
              chat_id = os.getenv(f'TG_CHAT_{i}')
              if token and chat_id:
                  try:
                      requests.post(f'https://api.telegram.org/bot{token}/sendMessage', json={
                          'chat_id': chat_id, 'text': message, 'parse_mode': 'HTML'
                      }, timeout=10)
                  except Exception:
                      pass
          EOF
          python run_helper.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.io'
          git add -f -A
          if git diff --staged --quiet; then
            echo "No changes detected, skipping commit."
          else
            git commit -m "Auto update TVBox sources with full HTTP 456 bypass and localization pipeline"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
